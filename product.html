<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.product"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body data-page="product">
  <div id="header"></div>
  <main>
    <div class="wrap page-head">
      <nav class="crumbs" id="crumbs" data-i18n-attr="aria-label:nav.crumbs"></nav>
    </div>
    <div class="wrap product">
      <div class="gallery" id="gallery"></div>
      <div class="panel product-info" id="info"></div>
    </div>
    <section class="wrap section">
      <div class="section-head"><h2 class="h-lg" id="relatedTitle" data-i18n="product.related"></h2></div>
      <div class="grid" id="related"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/config.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
