<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.about"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="about">
  <div id="header"></div>
  <main>
    <div class="wrap">
      <section class="block block-red about-hero" style="margin-top:8px">
        <div class="hero-media" id="aboutMedia" aria-hidden="true"></div>
        <p class="eyebrow" data-i18n="nav.about"></p>
        <h1 class="display" style="margin-top:12px;max-width:16ch" data-i18n="about.title"></h1>
        <p class="body-lg muted" style="margin-top:18px;max-width:52ch" data-i18n="about.lead"></p>
        <div class="actions" id="aboutActions" style="margin-top:28px;display:flex;flex-wrap:wrap;gap:12px"></div>
      </section>
    </div>

    <section class="wrap reveal" style="margin-top:20px">
      <div class="about-stats" id="aboutStats"></div>
    </section>

    <section class="wrap section reveal">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="home.range"></p>
          <h2 class="h-lg" data-i18n="about.offerTitle"></h2>
          <p class="muted" data-i18n="about.offerLead"></p>
        </div>
        <a class="link-arrow" href="shop.html"><span data-i18n="about.allRange"></span> <i data-icon="arrow" class="icon-sm"></i></a>
      </div>
      <div class="bento" id="aboutBento"></div>
    </section>

    <section class="wrap section reveal">
      <div class="about-why">
        <div class="about-why-head">
          <p class="eyebrow" data-i18n="about.whyEyebrow"></p>
          <h2 class="h-lg" data-i18n="about.whyTitle"></h2>
          <p class="muted" style="margin-top:12px" data-i18n="about.whyLead"></p>
        </div>
        <ul class="panel why-list">
          <li><span class="circle"><i data-icon="grid"></i></span><div><h3 class="h-md" data-i18n="about.why1Title"></h3><p class="muted" data-i18n="about.why1Text"></p></div></li>
          <li><span class="circle"><i data-icon="spark"></i></span><div><h3 class="h-md" data-i18n="about.why2Title"></h3><p class="muted" data-i18n="about.why2Text"></p></div></li>
          <li><span class="circle"><i data-icon="box"></i></span><div><h3 class="h-md" data-i18n="about.why3Title"></h3><p class="muted" data-i18n="about.why3Text"></p></div></li>
          <li><span class="circle"><i data-icon="repeat"></i></span><div><h3 class="h-md" data-i18n="about.why4Title"></h3><p class="muted" data-i18n="about.why4Text"></p></div></li>
        </ul>
      </div>
    </section>

    <section class="wrap section reveal">
      <div class="section-head"><div><p class="eyebrow" data-i18n="about.howEyebrow"></p><h2 class="h-lg" data-i18n="about.howTitle"></h2></div></div>
      <ol class="steps" style="padding:0;margin:0;list-style:none">
        <li class="block-purple"><h3 class="h-md" data-i18n="about.step1Title"></h3><p class="muted" data-i18n="about.step1Text"></p></li>
        <li class="block-green"><h3 class="h-md" data-i18n="about.step2Title"></h3><p class="muted" data-i18n="about.step2Text"></p></li>
        <li class="block-white"><h3 class="h-md" data-i18n="about.step3Title"></h3><p class="muted" data-i18n="about.step3Text"></p></li>
      </ol>
    </section>

    <section class="wrap section reveal">
      <div class="block block-ink about-contact" id="aboutContact"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
