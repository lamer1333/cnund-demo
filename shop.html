<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.shop"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body data-page="shop">
  <div id="header"></div>
  <main>
    <div class="wrap page-head">
      <nav class="crumbs" data-i18n-attr="aria-label:nav.crumbs"><a href="index.html" data-i18n="nav.home"></a><span aria-hidden="true">/</span><span id="crumbHere"></span></nav>
      <h1 class="h-lg" id="shopTitle"></h1>
    </div>
    <div class="wrap">
      <div class="chips" id="chips"></div>
      <div class="toolbar">
        <span class="muted" id="count"></span>
        <label class="sr-only" for="sort" data-i18n="shop.sortLabel"></label>
        <select class="select" id="sort">
          <option value="new" data-i18n="shop.sortNew"></option>
          <option value="name" data-i18n="shop.sortName"></option>
        </select>
      </div>
      <div class="grid" id="shopGrid"></div>
      <div id="shopEmpty"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/config.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
