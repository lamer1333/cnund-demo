<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.checkout"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <div id="header"></div>
  <main>
    <div class="wrap page-head">
      <nav class="crumbs" data-i18n-attr="aria-label:nav.crumbs"><a href="index.html" data-i18n="nav.home"></a><span aria-hidden="true">/</span><span data-i18n="checkout.title"></span></nav>
      <h1 class="h-lg" data-i18n="checkout.title"></h1>
    </div>
    <div class="wrap" id="checkoutRoot" style="margin-top:16px">
      <div class="split">
        <form class="panel form" id="checkoutForm">
          <h2 class="h-md" data-i18n="checkout.buyer"></h2>
          <div class="form-row" id="buyer"></div>

          <h2 class="h-md" style="margin-top:12px" data-i18n="checkout.address"></h2>
          <div class="form" id="addresses"></div>
          <div class="field"><label for="c7" data-i18n="checkout.note"></label><textarea class="textarea" id="c7" maxlength="1000" data-i18n-attr="placeholder:checkout.optional"></textarea></div>

          <p class="note note-purple" data-i18n="checkout.managerNote"></p>

          <div><button class="btn btn-primary" type="submit" data-i18n="checkout.submit"></button></div>
        </form>
        <aside class="panel aside">
          <h2 class="h-md" style="margin-bottom:16px" data-i18n="checkout.yourOrder"></h2>
          <div class="mini-lines" id="sumLines"></div>
          <div class="sum-rows">
            <div><span class="muted" data-i18n="sum.quantity"></span><span id="sumCount"></span></div>
            <div><span class="muted" data-i18n="sum.withoutVat"></span><span id="sumNet"></span></div>
            <div><span class="muted" data-i18n="sum.vat"></span><span id="sumVat"></span></div>
            <div class="total"><span data-i18n="sum.total"></span><span id="sumTotal"></span></div>
          </div>
          <a class="link" href="cart.html" data-i18n="checkout.editCart"></a>
        </aside>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
