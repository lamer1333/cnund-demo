<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Պատվերի ձևակերպում · JoyGroup</title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <div id="header"></div>
  <main>
    <div class="wrap page-head">
      <nav class="crumbs" aria-label="Ուղի"><a href="index.html">Գլխավոր</a><span aria-hidden="true">/</span><span>Պատվերի ձևակերպում</span></nav>
      <h1 class="h-lg">Պատվերի ձևակերպում</h1>
    </div>
    <div class="wrap" id="checkoutRoot" style="margin-top:16px">
      <div class="split">
        <form class="panel form" id="checkoutForm">
          <h2 class="h-md">Կոնտակտային տվյալներ</h2>
          <div class="form-row">
            <div class="field"><label for="c1">Անուն Ազգանուն</label><input class="input" id="c1" required autocomplete="name"></div>
            <div class="field"><label for="c2">Խանութի անվանումը</label><input class="input" id="c2" autocomplete="organization"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="c3">Հեռախոս</label><input class="input" id="c3" type="tel" required autocomplete="tel" placeholder="+374"></div>
            <div class="field"><label for="c4">Էլ. փոստ</label><input class="input" id="c4" type="email" autocomplete="email"></div>
          </div>

          <h2 class="h-md" style="margin-top:12px">Առաքում</h2>
          <div class="form-row">
            <div class="field"><label for="c5">Քաղաք / բնակավայր</label><input class="input" id="c5" required autocomplete="address-level2"></div>
            <div class="field"><label for="c6">Հասցե</label><input class="input" id="c6" required autocomplete="street-address"></div>
          </div>
          <div class="field"><label for="c7">Մեկնաբանություն պատվերի վերաբերյալ</label><textarea class="textarea" id="c7" placeholder="Ոչ պարտադիր"></textarea></div>

          <h2 class="h-md" style="margin-top:12px">Վճարման եղանակ</h2>
          <label class="radio-card"><input type="radio" name="pay" checked><span><strong>Կանխիկ՝ ստանալիս</strong><small>Վճարում եք առաքման պահին</small></span></label>
          <label class="radio-card"><input type="radio" name="pay"><span><strong>Բանկային փոխանցում</strong><small>Հաշիվը կուղարկվի պատվերը հաստատելուց հետո</small></span></label>

          <div><button class="btn btn-primary" type="submit">Հաստատել պատվերը</button></div>
        </form>
        <aside class="panel aside">
          <h2 class="h-md" style="margin-bottom:16px">Ձեր պատվերը</h2>
          <div class="mini-lines" id="sumLines"></div>
          <div class="sum-rows">
            <div><span class="muted">Քանակ</span><span id="sumCount"></span></div>
            <div class="total"><span>Ընդամենը</span><span id="sumTotal"></span></div>
          </div>
          <a class="link" href="cart.html">Փոփոխել զամբյուղը</a>
        </aside>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
