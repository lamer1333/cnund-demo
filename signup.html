<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.signup"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="signup">
  <div id="header"></div>
  <main>
    <div class="wrap" style="margin-top:12px">
      <div class="auth">
        <div class="panel" id="signupPanel">
          <h1 class="h-lg" data-i18n="nav.signup"></h1>
          <p class="muted" style="margin:8px 0 20px" data-i18n="signup.lead"></p>
          <div class="contact-list" id="signupContacts"></div>
          <div class="note" style="margin-top:16px"><i data-icon="lock" class="icon-sm"></i><span data-i18n="signup.closed"></span></div>
          <p class="muted" style="margin-top:20px"><span data-i18n="signup.already"></span> <a class="link" href="login.html" data-i18n="login.submit"></a></p>
        </div>
        <div class="block block-red">
          <div>
            <p class="eyebrow" data-i18n="perk.eyebrow"></p>
            <h2 class="h-lg" style="margin-top:10px" data-i18n="signup.join"></h2>
            <ul>
              <li><i data-icon="check"></i><span data-i18n="perk.prices"></span></li>
              <li><i data-icon="check"></i><span data-i18n="perk.fast"></span></li>
              <li><i data-icon="check"></i><span data-i18n="perk.history"></span></li>
            </ul>
          </div>
          <p class="muted" id="signupHours"></p>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
