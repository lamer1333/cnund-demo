<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title data-i18n="title.home"></title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body data-page="home">
  <div id="header"></div>
  <main>
    <section class="hero-full">
      <!-- Background animation slot: drop a <video>, <canvas> or <img> in here and it fills the whole hero behind the text. -->
      <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
      <div class="wrap hero-copy">
        <p class="eyebrow" data-i18n="home.eyebrow"></p>
        <h1 class="display" data-i18n="home.title"></h1>
        <p class="body-lg" data-i18n="home.lead"></p>
        <div class="actions"><a class="btn btn-on-red" href="shop.html"><span data-i18n="home.heroCta"></span> <i data-icon="arrow" class="icon-sm"></i></a></div>
      </div>
    </section>

    <section class="wrap section reveal">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="home.range"></p>
          <h2 class="h-lg" data-i18n="home.catsTitle"></h2>
          <p class="muted" data-i18n="home.catsLead"></p>
        </div>
      </div>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <section class="wrap section reveal">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="home.bestEyebrow"></p>
          <h2 class="h-lg" data-i18n="home.bestTitle"></h2>
        </div>
        <a class="link-arrow" href="shop.html"><span data-i18n="nav.viewAll"></span> <i data-icon="arrow" class="icon-sm"></i></a>
      </div>
      <div class="grid" id="bestGrid"></div>
    </section>

    <section class="wrap section reveal">
      <div class="promo-pair">
        <div class="block block-purple promo">
          <div>
            <h2 class="h-md" data-i18n="home.promoATitle"></h2>
            <p data-i18n="home.promoAText"></p>
            <a class="link-arrow" href="shop.html?cat=mom-tver-tarer"><span data-i18n="home.promoALink"></span> <i data-icon="arrow" class="icon-sm"></i></a>
          </div>
          <div class="tile" id="promoA"></div>
        </div>
        <div class="block block-green promo">
          <div>
            <h2 class="h-md" data-i18n="home.promoBTitle"></h2>
            <p data-i18n="home.promoBText"></p>
            <a class="link-arrow" href="shop.html?cat=khlapushkaner"><span data-i18n="nav.viewAll"></span> <i data-icon="arrow" class="icon-sm"></i></a>
          </div>
          <div class="tile" id="promoB"></div>
        </div>
      </div>
    </section>

    <section class="wrap section reveal">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="home.newEyebrow"></p>
          <h2 class="h-lg" data-i18n="home.newTitle"></h2>
        </div>
        <a class="link-arrow" href="shop.html"><span data-i18n="nav.viewAll"></span> <i data-icon="arrow" class="icon-sm"></i></a>
      </div>
      <div class="grid" id="newGrid"></div>
    </section>

    <section class="wrap section reveal">
      <div class="block block-red cta">
        <h2 class="h-lg" data-i18n="home.ctaTitle"></h2>
        <p class="body-lg muted" id="ctaText" data-i18n="home.ctaGuest"></p>
        <div class="actions" id="ctaActions"></div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/config.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
